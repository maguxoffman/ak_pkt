<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Packet Anomaly Guard (DPI Protocol Classification & Filtering)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(244, 63, 94, 0.05) 0%, transparent 40%);
      color: #f1f5f9;
      font-family: var(--font-sans);
    }
    .font-mono { font-family: var(--font-mono); }
    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border-radius: 12px;
    }
    .glass-panel-anomaly {
      background: rgba(244, 63, 94, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(244, 63, 94, 0.35);
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.15);
      border-radius: 12px;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(244, 63, 94, 0.3); }
      50% { box-shadow: 0 0 18px rgba(244, 63, 94, 0.7); }
    }
    .glow-anomaly { animation: pulseGlow 2s infinite ease-in-out; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
  </style>
</head>
<body class="antialiased selection:bg-rose-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Dynamic Host Binding based on current browser window location
    const host = window.location.hostname || 'localhost';
    const API_BASE = `http://${host}:8000`;
    const WS_URL = `ws://${host}:8000/ws/packets`;

    function App() {
      const [mainCategory, setMainCategory] = useState('analyze');
      const [isConnected, setIsConnected] = useState(false);
      const [packets, setPackets] = useState([]);
      const [anomalyPackets, setAnomalyPackets] = useState([]);
      const [protocolFilter, setProtocolFilter] = useState('ALL'); // Protocol DPI Filter State

      const [stats, setStats] = useState({
        total_packets: 0,
        anomalies_01_count: 0,
        max_score: 0,
        threshold: 0.70,
        current_filename: "분석 PCAP 선택 대기 중",
        total_packets_in_file: 0,
        max_packets_config: 0,
        warmup_count: 0,
        analysis_target_count: 0,
        saved_model_filename: "선택 안됨",
        approved_encrypted_ips: [],
        top_suspicious_ips: [],
        protocol_counts: {}
      });
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(1.0);
      const [selectedPacket, setSelectedPacket] = useState(null);
      const [activeTab, setActiveTab] = useState('anomaly');

      // [도움말 모달] State (3-SubTab Category System: guide, specs, tech)
      const [showHelpModal, setShowHelpModal] = useState(false);
      const [helpSubTab, setHelpSubTab] = useState('guide');

      // [학습 모델 상세보기 모달] State
      const [showModelDetailsModal, setShowModelDetailsModal] = useState(false);
      const [selectedModelDetailsData, setSelectedModelDetailsData] = useState(null);
      const [isLoadingModelDetails, setIsLoadingModelDetails] = useState(false);

      // PCAP Files List from /PCAP Directory
      const [pcapFilesList, setPcapFilesList] = useState([]);

      // [신규 학습 모달] State (Default to empty - User must select explicitly)
      const [showNewTrainModal, setShowNewTrainModal] = useState(false);
      const [selectedTrainPcapFile, setSelectedTrainPcapFile] = useState('');
      const [trainPreviewInfo, setTrainPreviewInfo] = useState(null);
      const [customModelName, setCustomModelName] = useState('');
      const [trainFromPkt, setTrainFromPkt] = useState(1);
      const [trainToPkt, setTrainToPkt] = useState(1000);
      const [isTraining, setIsTraining] = useState(false);

      // [분석하기 4단계] State (Default to empty - User must select explicitly)
      const [savedModelsList, setSavedModelsList] = useState([]);
      const [selectedAnalyzePcapFile, setSelectedAnalyzePcapFile] = useState('');
      const [analyzePreviewInfo, setAnalyzePreviewInfo] = useState(null);
      const [selectedModel, setSelectedModel] = useState('');
      const [fromPkt, setFromPkt] = useState(1);
      const [toPkt, setToPkt] = useState(2500);
      const [isPreparingAnalysis, setIsPreparingAnalysis] = useState(false);

      // Report Modal
      const [showReportModal, setShowReportModal] = useState(false);
      const [serverReportData, setServerReportData] = useState(null);
      const [isLoadingReport, setIsLoadingReport] = useState(false);

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        let ws;
        let retryTimer;

        const connectWS = () => {
          try {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
              console.log('[WebSocket] Connected cleanly to', WS_URL);
              setIsConnected(true);
            };
            ws.onmessage = (event) => {
              try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'INITIAL_STATE') {
                  if (msg.stats) setStats(msg.stats);
                  if (typeof msg.is_playing === 'boolean') setIsPlaying(msg.is_playing);
                  if (msg.speed) setSpeed(msg.speed);
                } else if (msg.type === 'PACKET_EVENT') {
                  const pkt = msg.packet;
                  if (msg.stats) setStats(msg.stats);
                  if (typeof msg.is_playing === 'boolean') setIsPlaying(msg.is_playing);

                  if (pkt && pkt.id) {
                    setPackets((prev) => [pkt, ...prev].slice(0, 100));
                    if (pkt.is_anomaly_01) {
                      setAnomalyPackets((prev) => [pkt, ...prev].slice(0, 50));
                    }
                  }
                }
              } catch (err) {
                console.error('[WebSocket] Message Parse Error:', err);
              }
            };
            ws.onclose = () => {
              setIsConnected(false);
              retryTimer = setTimeout(connectWS, 2500);
            };
            ws.onerror = () => setIsConnected(false);
          } catch (e) {
            retryTimer = setTimeout(connectWS, 3000);
          }
        };

        connectWS();
        fetchSavedModels();
        fetchPcapFiles();

        return () => {
          if (ws) ws.close();
          if (retryTimer) clearTimeout(retryTimer);
        };
      }, []);

      const fetchSavedModels = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/models`);
          const data = await res.json();
          if (data && data.models) {
            setSavedModelsList(data.models);
          }
        } catch (e) {
          console.error('Fetch Models Error:', e);
        }
      };

      const fetchPcapFiles = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/pcap-files`);
          const data = await res.json();
          if (data && data.files) {
            setPcapFilesList(data.files);
          }
        } catch (e) {
          console.error('Fetch PCAP Files Error:', e);
        }
      };

      const handleOpenModelDetails = async (filename) => {
        if (!filename) {
          alert('학습 모델을 먼저 선택해 주세요.');
          return;
        }
        setIsLoadingModelDetails(true);
        setShowModelDetailsModal(true);
        try {
          const res = await fetch(`${API_BASE}/api/model-details/${filename}`);
          const data = await res.json();
          if (res.ok) {
            setSelectedModelDetailsData(data);
          } else {
            alert(`모델 상세 정보 로드 실패: ${data.detail}`);
            setShowModelDetailsModal(false);
          }
        } catch (err) {
          alert('모델 임계치 및 특성 상세 정보를 가져오는 중 오류가 발생했습니다.');
          setShowModelDetailsModal(false);
        } finally {
          setIsLoadingModelDetails(false);
        }
      };

      // Fixed Robust Chart.js Lifecycle Management
      useEffect(() => {
        if (mainCategory !== 'analyze') {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }
          return;
        }

        if (!chartRef.current || typeof Chart === 'undefined') return;
        const ctx = chartRef.current.getContext('2d');
        if (!ctx) return;

        try {
          // If chart instance exists but belongs to an unmounted canvas, recreate it
          if (chartInstanceRef.current && chartInstanceRef.current.canvas !== chartRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }

          if (!chartInstanceRef.current) {
            chartInstanceRef.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: [],
                datasets: [
                  {
                    label: 'Isolation Score (10-Feature Vector with RTT)',
                    data: [],
                    borderColor: '#f43f5e',
                    backgroundColor: 'rgba(244, 63, 94, 0.15)',
                    borderWidth: 2,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                    fill: true,
                    tension: 0.3
                  },
                  {
                    label: '99.9% Cutoff Threshold',
                    data: [],
                    borderColor: '#f59e0b',
                    borderDash: [5, 5],
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false
                  }
                ]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                  x: { 
                    ticks: { color: '#64748b', font: { size: 10, family: 'Fira Code' } }, 
                    grid: { color: 'rgba(255, 255, 255, 0.05)' } 
                  },
                  y: { 
                    min: 0, 
                    max: 1.0, 
                    ticks: { color: '#64748b', font: { size: 10, family: 'Fira Code' } }, 
                    grid: { color: 'rgba(255, 255, 255, 0.05)' } 
                  }
                },
                plugins: {
                  legend: { 
                    labels: { color: '#94a3b8', font: { size: 11, family: 'Fira Code' } } 
                  }
                }
              }
            });
          }

          const recent = [...packets].slice(0, 30).reverse();
          const activeCutoff = stats.threshold || 0.70;

          if (recent.length > 0) {
            chartInstanceRef.current.data.labels = recent.map((p) => p.time_str || `#${p.id}`);
            chartInstanceRef.current.data.datasets[0].data = recent.map(p => p.score || 0);
            chartInstanceRef.current.data.datasets[1].data = recent.map(p => p.threshold || activeCutoff);
          } else {
            chartInstanceRef.current.data.labels = ['대기 중 (00:00:00)'];
            chartInstanceRef.current.data.datasets[0].data = [0];
            chartInstanceRef.current.data.datasets[1].data = [activeCutoff];
          }

          chartInstanceRef.current.update();
        } catch (chartErr) {
          console.warn('[Chart.js] Update error:', chartErr);
        }
      }, [packets, stats, mainCategory]);

      const handleTogglePlay = async () => {
        const next = !isPlaying;
        setIsPlaying(next);
        try {
          await fetch(`${API_BASE}/api/control`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: next ? 'play' : 'pause' })
          });
        } catch (e) {
          console.error('API Control Error:', e);
        }
      };

      const handleSpeedChange = async (s) => {
        setSpeed(s);
        try {
          await fetch(`${API_BASE}/api/control`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'set_speed', speed: s })
          });
        } catch (e) {
          console.error('API Speed Error:', e);
        }
      };

      // Reset Data -> Clean Reset of Currently Inspecting Source & Model Name
      const handleResetData = async () => {
        try {
          setPackets([]);
          setAnomalyPackets([]);
          setIsPlaying(false);
          setSelectedAnalyzePcapFile('');
          setSelectedModel('');
          setAnalyzePreviewInfo(null);

          const res = await fetch(`${API_BASE}/api/control`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'reset' })
          });
          const data = await res.json();
          if (data && data.stats) {
            setStats(data.stats);
          } else {
            setStats(prev => ({
              ...prev,
              total_packets: 0,
              anomalies_01_count: 0,
              max_score: 0.0,
              current_filename: "분석 PCAP 선택 대기 중",
              saved_model_filename: "선택 안됨",
              analysis_target_count: 0
            }));
          }
        } catch (e) {
          console.error('Reset error:', e);
        }
      };

      // [학습하기] Select PCAP File Handler
      const handleSelectTrainPcapFile = async (pcapFileName) => {
        if (!pcapFileName) {
          setSelectedTrainPcapFile('');
          setTrainPreviewInfo(null);
          setCustomModelName('');
          return;
        }
        setSelectedTrainPcapFile(pcapFileName);
        const cleanName = pcapFileName.replace(/\.[^/.]+$/, "");
        setCustomModelName(`model_${cleanName}`);

        setTrainPreviewInfo({
          filename: pcapFileName,
          total_packets: '패킷 수 계산 중...'
        });

        try {
          const res = await fetch(`${API_BASE}/api/pcap-info`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pcap_filename: pcapFileName })
          });
          const data = await res.json();
          if (res.ok) {
            setTrainPreviewInfo({
              filename: pcapFileName,
              total_packets: data.total_packets
            });
            setTrainFromPkt(1);
            setTrainToPkt(Math.min(1000, data.total_packets || 1000));
          }
        } catch (err) {
          console.error('Train PCAP Info Error:', err);
        }
      };

      // [신규 학습 실행]
      const handleExecuteNewTraining = async () => {
        if (!selectedTrainPcapFile) {
          alert('1단계: /PCAP 디렉토리에서 학습을 진행할 PCAP 파일을 먼저 선택해 주세요.');
          return;
        }
        if (!customModelName.trim()) {
          alert('저장할 학습 데이터 모델 이름을 입력해 주세요.');
          return;
        }
        setIsTraining(true);

        try {
          const res = await fetch(`${API_BASE}/api/train-model`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pcap_filename: selectedTrainPcapFile,
              custom_model_name: customModelName.trim(),
              from_pkt: trainFromPkt,
              to_pkt: trainToPkt
            })
          });
          const data = await res.json();
          setIsTraining(false);

          if (res.ok) {
            fetchSavedModels();
            if (data.model_filename) setSelectedModel(data.model_filename);
            setShowNewTrainModal(false);
            alert(`✅ 10-Feature (응답시간 RTT 포함) 학습 데이터 생성 완료!\n\n${data.message}`);
          } else {
            alert(`학습 진행 실패: ${data.detail}`);
          }
        } catch (e) {
          setIsTraining(false);
          alert('학습 데이터 생성 중 오류가 발생했습니다.');
        }
      };

      // [분석하기] 1단계 Select PCAP File Handler
      const handleSelectAnalyzePcapFile = async (pcapFileName) => {
        if (!pcapFileName) {
          setSelectedAnalyzePcapFile('');
          setAnalyzePreviewInfo(null);
          return;
        }

        setSelectedAnalyzePcapFile(pcapFileName);

        setIsPlaying(false);
        try {
          await fetch(`${API_BASE}/api/control`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'pause' })
          });
        } catch (err) {}

        setPackets([]);
        setAnomalyPackets([]);

        setAnalyzePreviewInfo({
          filename: pcapFileName,
          total_packets: '패킷 수 계산 중...'
        });

        try {
          const res = await fetch(`${API_BASE}/api/pcap-info`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pcap_filename: pcapFileName })
          });
          const data = await res.json();
          if (res.ok) {
            setAnalyzePreviewInfo({
              filename: pcapFileName,
              total_packets: data.total_packets
            });
            setFromPkt(1);
            setToPkt(Math.min(2500, data.total_packets || 2500));
          }
        } catch (err) {
          console.error('Analyze PCAP Info Error:', err);
        }
      };

      // Analysis Start -> Sets Currently Inspecting Source and Model Name
      const handleExecuteAnalysis = async () => {
        if (!selectedAnalyzePcapFile) {
          alert('1단계: /PCAP 디렉토리에서 분석을 진행할 PCAP 파일을 먼저 선택해 주세요.');
          return;
        }
        if (!selectedModel) {
          alert('3단계: /DATA.TRAIN 디렉토리에서 사용할 학습 모델을 먼저 선택해 주세요.');
          return;
        }

        setIsPreparingAnalysis(true);

        try {
          const res = await fetch(`${API_BASE}/api/analyze-pcap`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pcap_filename: selectedAnalyzePcapFile,
              model_filename: selectedModel,
              from_pkt: fromPkt,
              to_pkt: toPkt
            })
          });
          const data = await res.json();
          setIsPreparingAnalysis(false);

          if (res.ok) {
            if (data.stats) setStats(data.stats);
            setPackets([]);
            setAnomalyPackets([]);

            setIsPlaying(true);
            await fetch(`${API_BASE}/api/control`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'play' })
            });

            alert(`🚀 분석 시작!\n\n10-Feature 모델 [${selectedModel}]을 로드하여 PCAP 파일 "${selectedAnalyzePcapFile}" 범위 [${fromPkt.toLocaleString()} ~ ${toPkt.toLocaleString()}] 실시간 분석을 시작합니다.`);
          } else {
            alert(`분석 시작 실패: ${data.detail}`);
          }
        } catch (err) {
          setIsPreparingAnalysis(false);
          alert('분석 진행 중 오류가 발생했습니다.');
        }
      };

      const handleFetchServerReport = async () => {
        setIsLoadingReport(true);
        setShowReportModal(true);
        try {
          const res = await fetch(`${API_BASE}/api/server-report`);
          const data = await res.json();
          setServerReportData(data);
        } catch (err) {
          alert('서버 크기/속도 보고서를 생성하는 중 오류가 발생했습니다.');
        } finally {
          setIsLoadingReport(false);
        }
      };

      const handleFeedbackLearnIP = async (targetIp) => {
        if (!targetIp) return;
        try {
          const res = await fetch(`${API_BASE}/api/feedback-learn`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ip: targetIp, label: 'approved_server' })
          });
          const data = await res.json();

          if (res.ok) {
            if (data.stats) setStats(data.stats);
            setAnomalyPackets(prev => prev.filter(p => p.src_ip !== targetIp && p.dst_ip !== targetIp));
            alert(`🎓 AI 피드백 재학습 완료!\n\n서버 IP "${targetIp}"의 패킷 크기 및 전송 속도가 정상 예외 프로필로 반영되었습니다.`);
            if (showReportModal) handleFetchServerReport();
          }
        } catch (e) {
          alert('피드백 학습 적용 중 오류가 발생했습니다.');
        }
      };

      // Filter Packets Stream by DPI Protocol Filter
      const filterByProtocol = (list) => {
        return list.filter((p) => {
          if (protocolFilter === 'ALL') return true;
          if (protocolFilter === 'HTTP') return p.protocol === 'HTTP';
          if (protocolFilter === 'HTTPS') return p.protocol === 'HTTPS';
          if (protocolFilter === 'DNS') return p.protocol === 'DNS';
          if (protocolFilter === 'SSH_DB') return p.protocol === 'SSH' || p.protocol === 'DATABASE';
          if (protocolFilter === 'UDP_QUIC') return p.protocol === 'UDP' || p.protocol === 'QUIC';
          if (protocolFilter === 'OTHER') return !['HTTP', 'HTTPS', 'DNS', 'SSH', 'DATABASE', 'UDP', 'QUIC'].includes(p.protocol);
          return true;
        });
      };

      const filteredAnomalyPackets = filterByProtocol(anomalyPackets);
      const filteredLivePackets = filterByProtocol(packets);

      const anomalyRate = stats.total_packets > 0 
        ? ((stats.anomalies_01_count / stats.total_packets) * 100).toFixed(2) 
        : '0.00';

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto space-y-6">
          {/* Header */}
          <header className="glass-panel p-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-xl font-bold tracking-tight text-white">AI Packet Anomaly Guard</h1>
                <span className="px-2.5 py-0.5 text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded-full font-mono">
                  v2.8 10-Feature + DPI Protocol
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-0.5 flex items-center gap-2 font-mono">
                <span>Isolation Forest Engine (10-Feature Vector with DPI Auto-Classification)</span>
                <span>•</span>
                <span className={isConnected ? "text-emerald-400 font-bold" : "text-rose-500 font-bold"}>
                  {isConnected ? `● LIVE WS (${host})` : '○ CONNECTING...'}
                </span>
                <span>•</span>
                <span className="text-amber-400">99.9% Cutoff: {stats.threshold}</span>
              </p>
            </div>

            {/* Category Switcher & Help Button */}
            <div className="flex items-center gap-2 font-mono">
              <button

                ) : serverReportData ? (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                      <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                        <span className="text-xs text-slate-400 uppercase">종합 위험도</span>
                        <span className={`text-xl font-extrabold mt-1 block ${
                          serverReportData.summary.overall_risk === 'CRITICAL' ? 'text-rose-400' : 'text-emerald-400'
                        }`}>
                          {serverReportData.summary.overall_risk === 'CRITICAL' ? '🔴 이상 탐지' : '🟢 정상 레벨'}
                        </span>
                      </div>
                      <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                        <span className="text-xs text-slate-400 uppercase">분석 대상 서버</span>
                        <span className="text-xl font-extrabold text-cyan-300 mt-1 block">{serverReportData.summary.total_servers} 개 IP</span>
                      </div>
                      <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                        <span className="text-xs text-slate-400 uppercase">검사된 패킷 수</span>
                        <span className="text-xl font-extrabold text-white mt-1 block">{(serverReportData.summary.total_inspected_packets || 0).toLocaleString()} 개</span>
                      </div>
                      <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl">
                        <span className="text-xs text-slate-400 uppercase">0.1% 이상치</span>
                        <span className="text-xl font-extrabold text-rose-400 mt-1 block">{(serverReportData.summary.anomalies_detected || 0).toLocaleString()} 건</span>
                      </div>
                    </div>

                    <div className="space-y-4">
                      {serverReportData.servers.map((srv, idx) => (
                        <div key={srv.ip} className="p-5 rounded-xl border bg-slate-900/90 border-slate-800">
                          <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h4 className="text-base font-extrabold text-white">#{idx+1} {srv.ip} ({srv.role})</h4>
                            <span className="px-3 py-1 bg-slate-800 text-cyan-300 rounded font-bold">{srv.risk_badge}</span>
                          </div>
                          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 my-3 text-xs">
                            <div className="p-2 bg-slate-950 rounded">트래픽: {srv.packet_count.toLocaleString()}개 ({srv.bytes_formatted})</div>
                            <div className="p-2 bg-slate-950 rounded text-cyan-300">크기: 평균 {srv.avg_size}B / 최대 {srv.max_size}B</div>
                            <div className="p-2 bg-slate-950 rounded text-amber-300">속도: {srv.max_pps} pps ({(srv.max_bps/1024).toFixed(1)} KB/s)</div>
                            <div className="p-2 bg-slate-950 rounded text-purple-300">간격: {srv.min_delta_ms} ms</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : null}
              </div>
            </div>
          )}

          {/* Inspector Modal */}
          {selectedPacket && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-panel w-full max-w-4xl max-h-[85vh] p-5 overflow-y-auto space-y-4 font-mono text-xs">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <span>Packet Inspector #{selectedPacket.id}</span>
                      <span className={selectedPacket.is_anomaly_01 ? "px-2 py-0.5 bg-rose-500 text-white rounded text-xs font-bold" : "px-2 py-0.5 bg-emerald-500 text-slate-950 rounded text-xs font-bold"}>
                        {selectedPacket.is_anomaly_01 ? "🔴 Anomaly Outlier" : "🟢 Normal"}
                      </span>
                    </h3>
                    <p className="text-[11px] text-slate-400 mt-0.5">
                      Score: <strong className={selectedPacket.is_anomaly_01 ? "text-rose-400" : "text-emerald-400"}>{selectedPacket.score}</strong> | Cutoff: <strong className="text-amber-400">{selectedPacket.threshold || stats.threshold}</strong>
                    </p>
                  </div>
                  <button onClick={() => setSelectedPacket(null)} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-semibold">Close</button>
                </div>

                {/* 🎯 Metric vs 99.9% Model Threshold Comparison Table */}
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                  <div className="flex items-center justify-between">
                    <h4 className="font-extrabold text-amber-300 text-xs flex items-center gap-2">
                      <span>🎯 패킷 측정치 vs 모델 99.9% 임계치 초과 비교 분석표</span>
                    </h4>
                    <span className="text-[11px] text-slate-400">
                      Isolation Score: <strong className={selectedPacket.is_anomaly_01 ? "text-rose-400" : "text-emerald-400"}>{selectedPacket.score}</strong> (Cutoff: {selectedPacket.threshold || stats.threshold})
                    </span>
                  </div>

                  <div className="overflow-x-auto bg-slate-900 border border-slate-800 rounded-lg">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-950 text-slate-400 uppercase border-b border-slate-800">
                        <tr>
                          <th className="p-2.5">특성 항목 (Metric)</th>
                          <th className="p-2.5">이 패킷의 측정값</th>
                          <th className="p-2.5">모델 99.9% 임계점</th>
                          <th className="p-2.5 text-center">임계치 초과 여부</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 font-mono">
                        {(selectedPacket.metric_comparison || [
                          {name: "Length (패킷 전체 크기)", val: `${selectedPacket.length} Bytes`, thresh: "≥ 1500.0 B", exceeded: (selectedPacket.length >= 1500)},
                          {name: "Payload Length (순수 페이로드)", val: `${selectedPacket.payload_len || 0} Bytes`, thresh: "≥ 1460.0 B", exceeded: ((selectedPacket.payload_len || 0) >= 1460)},
                          {name: "Packet Rate (초당 패킷 수)", val: `${selectedPacket.packet_rate_pps || 1} pps`, thresh: "≥ 200.0 pps", exceeded: ((selectedPacket.packet_rate_pps || 1) >= 200)},
                          {name: "Byte Rate (대역폭 사용량)", val: `${((selectedPacket.byte_rate_bps || 0)/1024/1024).toFixed(2)} MB/s`, thresh: "≥ 1.0 MB/s", exceeded: (((selectedPacket.byte_rate_bps || 0)/1024/1024) >= 1.0)},
                          {name: "Delta Time (수신 도착 간격)", val: `${selectedPacket.delta_time_ms || 10} ms`, thresh: "≤ 0.5 ms (초고속 연사)", exceeded: ((selectedPacket.delta_time_ms || 10) <= 0.5)},
                          {name: "PPS Variance (속도 변동성)", val: `${selectedPacket.pps_variance || 0}`, thresh: "≥ 100.0", exceeded: ((selectedPacket.pps_variance || 0) >= 100)},
                          {name: "TCP SYN Flag (SYN 연결요청)", val: `${selectedPacket.tcp_syn_flag || 0}`, thresh: "= 1.0 (SYN)", exceeded: (selectedPacket.tcp_syn_flag === 1)},
                          {name: "RTT Response Time (응답시간)", val: `${selectedPacket.rtt_ms || 0} ms`, thresh: "≥ 50.0 ms", exceeded: ((selectedPacket.rtt_ms || 0) >= 50)}
                        ]).map((item, idx) => (
                          <tr key={idx} className={item.exceeded ? "bg-rose-500/20" : "hover:bg-slate-800/40"}>
                            <td className="p-2.5 font-bold text-slate-200">{item.name}</td>
                            <td className={`p-2.5 font-extrabold ${item.exceeded ? "text-rose-400" : "text-cyan-300"}`}>{item.val}</td>
                            <td className="p-2.5 text-slate-400">{item.thresh}</td>
                            <td className="p-2.5 text-center">
                              {item.exceeded ? (
                                <span className={`px-2 py-0.5 font-extrabold rounded text-[10px] shadow ${item.is_joint ? "bg-amber-500 text-slate-950" : "bg-rose-500 text-white"}`}>
                                  {item.is_joint ? "⚠️ 10D 밀도 조합 이탈" : "⚠️ 99.9% 초과 이상치"}
                                </span>
                              ) : (
                                <span className="px-2 py-0.5 bg-slate-800 text-slate-400 rounded text-[10px]">
                                  🟢 정상 이내
                                </span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="p-3 bg-slate-950 border border-slate-800 rounded">
                  <h4 className="font-bold text-cyan-400 mb-1">Protocol Layer Tree</h4>
                  {(selectedPacket.header_tree || []).map((t, idx) => (
                    <div key={idx} className="mb-1">
                      <span className="text-white font-bold">{t.layer}:</span> <span className="text-slate-400">{t.info}</span>
                    </div>
                  ))}
                </div>

                <div className="p-3 bg-slate-950 border border-slate-800 rounded">
                  <h4 className="font-bold text-amber-400 mb-1">10-Feature Metrics Summary</h4>
                  <div className="text-slate-300 whitespace-pre-wrap">{selectedPacket.hex_payload || 'No Payload Bytes'}</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } catch (renderErr) {
      console.error('React Root Render Exception:', renderErr);
    }
  </script>
</body>
</html>
